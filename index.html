<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ルミナスクエスト 体験版</title>
<style>
  html,body{margin:0;background:#0b0b12;color:#aab;font-family:sans-serif;height:100%}
  body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
  canvas{width:min(96vw,calc(88vh*768/672),960px);aspect-ratio:768/672;background:#000;touch-action:none;border:2px solid #223}
  #help{font-size:12px;opacity:.7;text-align:center;line-height:1.5}
  #pad{display:none;width:96vw;max-width:520px;justify-content:space-between;user-select:none;-webkit-user-select:none}
  @media (pointer:coarse){#pad{display:flex}#help{display:none}}
  .dp{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:2px}
  .b{background:#223;border:1px solid #556;color:#ccd;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;touch-action:none}
  .ab{display:flex;gap:14px;align-items:center}
  .ab .b{width:64px;height:64px;border-radius:50%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="help">移動: 矢印キー / WASD　決定: Z・Enter・Space　キャンセル: X・Esc　音のON/OFF: M</div>
<div id="pad">
  <div class="dp">
    <div></div><div class="b" data-k="up">▲</div><div></div>
    <div class="b" data-k="left">◀</div><div></div><div class="b" data-k="right">▶</div>
    <div></div><div class="b" data-k="down">▼</div><div></div>
  </div>
  <div class="ab"><div class="b" data-k="cancel">B</div><div class="b" data-k="ok">A</div></div>
</div>
<script src="art.js"></script>
<script src="game.js"></script>
</body>
</html>
